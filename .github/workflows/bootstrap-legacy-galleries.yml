name: Bootstrap legacy galleries (one-time)
on:
  push:
    branches: [feature/legacy-preview-gallery-manifests]
    paths:
      - .github/workflows/bootstrap-legacy-galleries.yml
      - scripts/bootstrap_legacy_galleries.py
      - scripts/build_legacy_galleries.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/legacy-preview-gallery-manifests
      - name: Extract image lists while preserving approved HTML exactly
        run: |
          python3 scripts/bootstrap_legacy_galleries.py --slugs boscobel-heights-residence mannings-hill-road-apartment-complex
          python3 scripts/build_legacy_galleries.py --check
          python3 -m py_compile scripts/bootstrap_legacy_galleries.py scripts/build_legacy_galleries.py
          python3 scripts/check_seo.py
      - name: Commit original templates and image-order manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/gallery-manifests scripts/templates/legacy-gallery
          # Original presentation HTML contains intentional inherited whitespace.
          git -c core.whitespace=-blank-at-eol diff --cached --check
          git commit -m "Standardize Boscobel and Mannings galleries with lossless source manifests"
          git push origin HEAD:refs/heads/feature/legacy-preview-gallery-manifests
