name: ArchViz staging migration and build
on:
  push:
    branches:
      - refactor/arch-viz-single-source-20261106
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import legacy project content once
        run: node scripts/import_archviz_once.mjs
      - name: Render shared ArchViz templates
        run: node scripts/build_previews.mjs
      - name: Verify generated pages are stable
        run: node scripts/build_previews.mjs --check
      - name: Preserve generated staging pages and Salisbury source for QA
        uses: actions/upload-artifact@v4
        with:
          name: archviz-qa-${{ github.run_id }}
          retention-days: 3
          path: |
            previews/*/index.html
            previews/projects/*.json
            previews/assets/css/arch-viz.css
            scripts/build_previews.mjs
      - name: Validate metadata, navigation and sitemap
        run: |
          python3 scripts/check_seo.py
          git diff --check
      - name: Commit generated static pages to staging only
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/templates/crio-project.html.tmpl previews/projects previews/*/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate ArchViz pages from shared manifest template (run ${{ github.run_id }}) [skip ci]"
            git push origin HEAD:refactor/arch-viz-single-source-20261106
          fi
