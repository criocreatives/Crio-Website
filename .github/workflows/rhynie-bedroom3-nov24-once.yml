name: Replace Bedroom 3 Images November 24
on:
  push:
    paths:
      - .github/workflows/rhynie-bedroom3-nov24-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-bedroom3-nov24
  cancel-in-progress: false
jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Upload all five verified WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/yU33U7vPf6A2QLR1' --output previews/rhynie-drive/images/bedroom-3-tv-wall-20261124.webp
          echo '6d3844beaba360740137b72d04b5806b00267c7b4f71f2177ec138fab6742ea7  previews/rhynie-drive/images/bedroom-3-tv-wall-20261124.webp' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/KluRIw8Evsifw79Q' --output previews/rhynie-drive/images/bedroom-3-window-side-20261124.webp
          echo 'd1968be2b2699fab8b3555b5bc7c1063ce1c6e07a33cd3a6ea7bdc37eef59dcd  previews/rhynie-drive/images/bedroom-3-window-side-20261124.webp' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/zdHsAkUsRoyYqRif' --output previews/rhynie-drive/images/bedroom-3-vanity-20261124.webp
          echo '8449cb0e0f50c59d1ff1cb421a0486632e58f679ce9ebf28f9cc495fcf1b2ccc  previews/rhynie-drive/images/bedroom-3-vanity-20261124.webp' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/0WpLlfGQUya1Dp3U' --output previews/rhynie-drive/images/bedroom-3-angled-beds-20261124.webp
          echo '2bc8973b1089d1cc6b2ef322976910702127c76d4ffa2bf695f728573d185632  previews/rhynie-drive/images/bedroom-3-angled-beds-20261124.webp' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/48W5azVeJHy55o1n' --output previews/rhynie-drive/images/bedroom-3-front-beds-20261124.webp
          echo '18848aa4b4db1e9446e6aab630dcaebd845a2fe94cae97ba034c80c7b17baa63  previews/rhynie-drive/images/bedroom-3-front-beds-20261124.webp' | sha256sum -c -
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=["bedroom-3-tv-wall-20261124.webp","bedroom-3-window-side-20261124.webp","bedroom-3-vanity-20261124.webp","bedroom-3-angled-beds-20261124.webp","bedroom-3-front-beds-20261124.webp"]
          for name in names:
              p=Path("previews/rhynie-drive/images")/name
              with Image.open(p) as im:
                  assert im.format=="WEBP" and im.size==(1536,1024), (name,im.format,im.size)
              print("Validated",name,p.stat().st_size,"bytes")
          PY
      - name: Replace Bedroom 3 gallery source only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("previews/projects/rhynie-drive.json")
          m=json.loads(p.read_text())
          s=next((x for x in m["sections"] if x["id"]=="bedroom-3"),None)
          assert m["schema_version"]==2 and m["slug"]=="rhynie-drive"
          assert m["title"]=="22B Maffee Drive Villa Renovation" and len(m["sections"])==11
          assert sum(len(x["images"]) for x in m["sections"])==32
          assert s and len(s["images"])==4 and s["groups"]==[1,2,1]
          assert all(x["src"].startswith("/previews/rhynie-drive/images/bedroom-3-") for x in s["images"])
          base="/previews/rhynie-drive/images/"
          s["images"]=[
            {"src":base+"bedroom-3-tv-wall-20261124.webp","alt":"Bedroom 3 television wall, floating walnut media console, windows, and two double beds in the foreground"},
            {"src":base+"bedroom-3-window-side-20261124.webp","alt":"Bedroom 3 angled view of two double beds against the botanical accent wall, windows and media wall"},
            {"src":base+"bedroom-3-vanity-20261124.webp","alt":"Bedroom 3 vanity and mirror opposite the botanical feature wall and double beds"},
            {"src":base+"bedroom-3-angled-beds-20261124.webp","alt":"Bedroom 3 double beds with olive green bed runners, walnut nightstands and tropical botanical wallpaper"},
            {"src":base+"bedroom-3-front-beds-20261124.webp","alt":"Bedroom 3 front view of two double beds with walnut nightstands and a full-width tropical botanical feature wall"}
          ]
          s["groups"]=[1,2,2]
          s["paragraphs"][1]="Two double beds sit against a tropical botanical feature wall, with walnut furniture, olive-green textiles, a dressing table and a wall-mounted television."
          assert sum(len(x["images"]) for x in m["sections"])==33
          assert sum(s["groups"])==len(s["images"])
          assert all((Path("previews/rhynie-drive") / x["src"].removeprefix("/previews/rhynie-drive/")).is_file() for x in s["images"])
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+"\n")
          print("Bedroom 3 updated: five images, groups",s["groups"],"all 33 gallery images accounted for")
          PY
      - name: Commit source and assets atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/projects/rhynie-drive.json previews/rhynie-drive/images/bedroom-3-*-20261124.webp
          git diff --cached --stat
          git commit -m 'Replace Bedroom 3 gallery with five updated WebP renders'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep 2
          done
          exit 1
