name: Upload Living Room 2 Single Replacement Nov 24
on:
  push:
    paths:
      - .github/workflows/rhynie-living2-single-20261124-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-living2-single-nov24-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate uploaded WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/MUkww5QItLW1hopL' --output previews/rhynie-drive/images/living-room-2-final.webp
          echo '3f08c1273dd30939809d2772b44d12413168d03b487ba9d57ac4ad3857a4bee9  previews/rhynie-drive/images/living-room-2-final.webp' | sha256sum -c -
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('previews/rhynie-drive/images/living-room-2-final.webp')
          b=p.read_bytes()
          assert len(b)==115282, len(b)
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
          print('Verified exact user-uploaded WebP:',len(b),'bytes')
          PY
      - name: Commit new WebP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/living-room-2-final.webp
          git commit -m 'Add approved single Living Room 2 render'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep 2
          done
          exit 1
