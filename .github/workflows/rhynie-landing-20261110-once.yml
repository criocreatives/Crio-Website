name: Upload staircase landing WebP variants
on:
  push:
    paths:
      - .github/workflows/rhynie-landing-20261110-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-landing-20261110-upload
  cancel-in-progress: false
jobs:
  upload-landing-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify original JPEG files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/ICqht06OdrmSponT' -o '/tmp/landing-one.jpeg'
          echo '573a3ffd754467815fbdbd23eff95adb634c5c16e9c1f16ae7c937ce194b423c  /tmp/landing-one.jpeg' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/2sH0dHhBiiftG0eg' -o '/tmp/landing-two.jpeg'
          echo '2aada4853a1938233b2723378c4a161b900b3c71208f65be085a9d61e59d8398  /tmp/landing-two.jpeg' | sha256sum -c -
      - name: Convert both JPEGs to optimized WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          items = [{"src":"/tmp/landing-one.jpeg","dest":"previews/rhynie-drive/images/staircase-landing-variation-1.webp","size":[1024,1536]},{"src":"/tmp/landing-two.jpeg","dest":"previews/rhynie-drive/images/staircase-landing-variation-2.webp","size":[864,1536]}]
          for item in items:
              src, dest = Path(item['src']), Path(item['dest'])
              with Image.open(src) as f:
                  image = ImageOps.exif_transpose(f).convert('RGB')
                  assert list(image.size) == item['size'], (src, image.size)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  image.save(dest, format='WEBP', quality=90, method=6)
              b = dest.read_bytes()
              assert b[:4] == b'RIFF' and b[8:12] == b'WEBP' and len(b) > 25000
              with Image.open(dest) as verified:
                  assert verified.size == tuple(item['size']) and verified.format == 'WEBP'
              print(f'{dest}: WebP {len(b)} bytes at {item["size"]}')
          PY
      - name: Commit only two image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/staircase-landing-variation-1.webp previews/rhynie-drive/images/staircase-landing-variation-2.webp
          if git diff --cached --quiet; then echo 'Images already current'; exit 0; fi
          git commit -m 'Add staircase landing variations as WebP images'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep 2
          done
          exit 1
