name: Validate published /previews/ URLs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-preview-urls.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify HTTP 200 on new preview URLs
        run: |
          set -euo pipefail
          base="https://criocreatives.com/previews"
          for path in             "" "list/" "9-salisbury-avenue/" "74-chisholms-avenue/"             "boscobel-heights-residence/" "chateau-de-chanel/"             "experimental-circular-home/" "good-morning/" "graphic-design/"             "koolya/" "lot-18-mount-boon/" "mannings-hill-road-apartment-complex/"             "runkus-epk/" "summit/" "tiny-living/" "tyre-warehouse-automotive/"             "assets/css/architecture-2026.css"             "assets/js/presentation-init.js"             "lot-18-mount-boon/renders/Image2.jpg"             "74-chisholms-avenue/74%20chisholm%20ave.mp4"
          do
            code=$(curl -L --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error --output /dev/null --write-out '%{http_code}' "${base}/${path}")
            printf '%s -> %s\n' "${base}/${path}" "${code}"
            test "${code}" = "200"
          done
