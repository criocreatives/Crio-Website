name: Replace Rhynie Drive Master Bathroom WebP
on:
  push:
    paths:
      - .github/workflows/rhynie-master-bathroom-wallpaper-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-master-bathroom-wallpaper-upload
  cancel-in-progress: false
jobs:
  replace-master-bathroom-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact approved master bathroom render
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/gAYocmaaxeZuxJ9a' --output /tmp/rhynie-master-bathroom-original.jpg
          echo 'ce41d4e13e1edebfa8aa0b10bdc4e06ab1e0a677168fc87f377db8fdcc0c0a8d  /tmp/rhynie-master-bathroom-original.jpg' | sha256sum -c -
      - name: Convert original to WebP preserving dimensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'Pillow==12.3.0'
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          source=Path('/tmp/rhynie-master-bathroom-original.jpg')
          dest=Path('previews/rhynie-drive/images/master-bathroom-vanity-shower.webp')
          with Image.open(source) as original:
              image=ImageOps.exif_transpose(original).convert('RGB')
              assert image.size == (1447, 1087), image.size
              image.save(dest, format='WEBP', quality=91, method=6)
          b=dest.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP' and len(b) > 100000
          with Image.open(dest) as result:
              assert result.size == (1447, 1087), result.size
              assert result.format == 'WEBP'
          print(f'Converted {source.stat().st_size} JPEG bytes to {len(b)} WebP bytes')
          PY
      - name: Commit the replacement WebP only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/master-bathroom-vanity-shower.webp
          if git diff --cached --quiet; then echo 'Image already matches'; exit 0; fi
          git commit -m 'Replace Master Bathroom vanity render with wallpaper update WebP'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo 'Converted WebP committed to main'
              exit 0
            fi
            sleep 2
          done
          exit 1
