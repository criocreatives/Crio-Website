name: Upload Rhynie Drive Powder Room original WebPs
on:
  push:
    paths:
      - .github/workflows/rhynie-powder-room-upload.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload-powder-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download submitted powder room images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/Tt9hNjptlPG3opqp' --output 'previews/rhynie-drive/images/powder-room-toilet.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/Q9U8LUwZxjhRA9ia' --output 'previews/rhynie-drive/images/powder-room-vanity.webp'
      - name: Verify original WebP bytes and portrait dimensions
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' \
            'e1e98e8b8b57cfc22d0c640a723bcee608bcfb7d1e304ccdda3cb9b76ec02e80  powder-room-toilet.webp' \
            '9975536cb7004e0e3bfcb52e42acaf983c4d75c4d9136b28cc7faeaa07a656d7  powder-room-vanity.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          files = ["powder-room-toilet.webp","powder-room-vanity.webp"]
          for file in files:
              data=Path(file).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', file
              assert len(data)>100000, file
              print(f'Verified: {file} ({len(data)} bytes)')
          PY
      - name: Commit original powder room assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/powder-room-toilet.webp previews/rhynie-drive/images/powder-room-vanity.webp
          if git diff --cached --quiet; then echo "Powder Room assets already current"; exit 0; fi
          git commit -m 'Add two original Rhynie Drive Powder Room WebPs'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
