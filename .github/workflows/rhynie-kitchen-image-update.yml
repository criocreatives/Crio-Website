name: Update Rhynie Drive kitchen images
on:
  push:
    paths:
      - .github/workflows/rhynie-kitchen-image-update.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-kitchen-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved replacement images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/gB3pW5y6tWtXBCvc' --output previews/rhynie-drive/images/kitchen-overview-alternative.webp
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/b9C8mqAlzXGuJRyx' --output previews/rhynie-drive/images/kitchen-sink-alternative.webp
          python3 - <<'PY'
          from pathlib import Path
          for name in ('kitchen-overview-alternative.webp', 'kitchen-sink-alternative.webp'):
              path = Path('previews/rhynie-drive/images') / name
              data = path.read_bytes()
              assert len(data) > 100000, f'{name}: unexpectedly small file'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{name}: not WebP'
              print(f'{name}: validated {len(data)} bytes')
          PY
      - name: Commit image replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/kitchen-overview-alternative.webp previews/rhynie-drive/images/kitchen-sink-alternative.webp
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'Update Rhynie Drive alternate kitchen renders'
          git push
