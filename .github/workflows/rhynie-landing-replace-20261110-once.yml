name: Replace Rhynie Drive Staircase Landing Images
on:
  push:
    paths:
      - .github/workflows/rhynie-landing-replace-20261110-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-landing-originals-nov10-replace
  cancel-in-progress: false
jobs:
  replace-user-uploaded-webps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact user-supplied WebP files and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/3Z5uYYPxBkczBVOi' --output 'previews/rhynie-drive/images/staircase-landing-variation-1.webp'
          echo '390bf2c96ac3cca98d2343cb9754f6d1bd8739ec1b897b6fa82db6a091a9a243  previews/rhynie-drive/images/staircase-landing-variation-1.webp' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/bQmhCLCaVRxaW0HC' --output 'previews/rhynie-drive/images/staircase-landing-variation-2.webp'
          echo 'c17e8774ea9b7169d8ff7d3b39e9563c449ab5223e1c0a094a559189c842d10e  previews/rhynie-drive/images/staircase-landing-variation-2.webp' | sha256sum -c -
      - name: Validate both WebP images and dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [{"path":"previews/rhynie-drive/images/staircase-landing-variation-1.webp","size":275740},{"path":"previews/rhynie-drive/images/staircase-landing-variation-2.webp","size":241980}]
          for f in files:
              blob=Path(f['path']).read_bytes()
              assert len(blob)==f['size'], f
              assert blob[:4]==b'RIFF' and blob[8:12]==b'WEBP', f
              print(f"{f['path']} — verified {len(blob)} bytes")
          PY
      - name: Commit only the two replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/staircase-landing-variation-1.webp previews/rhynie-drive/images/staircase-landing-variation-2.webp
          if git diff --cached --quiet; then echo 'Both images already current'; exit 0; fi
          git commit -m 'Replace staircase landing renders with latest supplied WebPs'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo 'WebP replacements committed'
              exit 0
            fi
            sleep 2
          done
          exit 1
