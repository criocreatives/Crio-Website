name: SEO and static website validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SEO metadata, indexing, and sitemap
        run: python scripts/check_seo.py
