name: Replace Rhynie Drive Bedroom 3 photos
on:
  push:
    paths:
      - .github/workflows/rhynie-bedroom-3-replacement.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-bedroom-3-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download five replacement renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/iZl5HnLFRJlssW6w' --output 'previews/rhynie-drive/images/bedroom-3-front-view.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/lnMaB3fvssc9aQzN' --output 'previews/rhynie-drive/images/bedroom-3-media-wall.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/SS4pMajMyLXOQyfl' --output 'previews/rhynie-drive/images/bedroom-3-vanity-view.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/ZpnIeOKCZFV9OIYQ' --output 'previews/rhynie-drive/images/bedroom-3-angled-view.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/6zbJvM2jGh1U6S49' --output 'previews/rhynie-drive/images/bedroom-3-window-view.webp'
      - name: Verify all images match the uploaded source files
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' \
            '1ff88a36ac6512edcbcf813d01410f72d0711ab6af71d309a730b1e61285b87b  bedroom-3-front-view.webp' \
            'b0546596555335d8dbececd897a56a59ddbbe5f9120fb784f0fb183c23240bc9  bedroom-3-media-wall.webp' \
            '8c3ec7ae82ad6499ccbd7ffe8fae8ad73a6e87b40f7739cc52aac03218  bedroom-3-vanity-view.webp' \
            'fd5794218e5642572ed2ae92a211b1feaccfb984a3a26ec45361b079844b9a12  bedroom-3-angled-view.webp' \
            '7cdf15bec204d7a30966e232f8b2a552a2d8004b49b381d7f1c372788fedc8  bedroom-3-window-view.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct
          names = ["bedroom-3-front-view.webp","bedroom-3-media-wall.webp","bedroom-3-vanity-view.webp","bedroom-3-angled-view.webp","bedroom-3-window-view.webp"]
          for name in names:
              data=Path(name).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', f'{name} is not a WebP'
              assert len(data)>100000, f'{name} is unexpectedly small'
              print(f'Verified {name}: {len(data)} bytes')
          PY
      - name: Commit replacement Bedroom 3 images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/bedroom-3-front-view.webp previews/rhynie-drive/images/bedroom-3-media-wall.webp previews/rhynie-drive/images/bedroom-3-vanity-view.webp previews/rhynie-drive/images/bedroom-3-angled-view.webp previews/rhynie-drive/images/bedroom-3-window-view.webp
          if git diff --cached --quiet; then echo 'All Bedroom 3 files already current'; exit 0; fi
          git commit -m 'Replace five Bedroom 3 preview images with updated renders'
          git push
