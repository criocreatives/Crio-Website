name: Update Rhynie Drive living guest and dining renders
on:
  push:
    paths:
      - .github/workflows/rhynie-oct31-renders.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-approved-renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original approved WebP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/27fPWCn01atIwcOD' --output 'previews/rhynie-drive/images/living-angle.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/1pauNglqt7zWxfIS' --output 'previews/rhynie-drive/images/guestroom-overview.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/DjFWjbpV8c7vis4q' --output 'previews/rhynie-drive/images/guestroom-angled.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/1JRnCOyAffVvrLuK' --output 'previews/rhynie-drive/images/guestroom-seating.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/FHYMYCHcywN298ZP' --output 'previews/rhynie-drive/images/dining-overview.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/Tx3ljs7o5UfgHUmm' --output 'previews/rhynie-drive/images/living-front.webp'
      - name: Verify uploads match submitted image files exactly
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' \
            '5cd2401aac414365992bb15b668ac94cfd11efd7e5f928b2077d33b0caf468e6  living-angle.webp' \
            '7d9cd20abb8cb81759591ba7184eb206d48da095c923854aebd864f8e3e96578  guestroom-overview.webp' \
            '777cdd675065a47b96cc5859b30231d1c06610a4b97d336230d43e64bac9ea8e  guestroom-angled.webp' \
            '54f54041d9b52e066e29c10b450a42b4e32a638653dc8907ff03ab96646f431f  guestroom-seating.webp' \
            '08a1de0340ed1b20fc0ab84974f8e5b0a78cf7d32d22ec9ba03fbda3f1a3f9ad  dining-overview.webp' \
            '609b95adbb6b316c1a760c602d5f352f86cb484d453dce4fc27c864bb4716e44  living-front.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files = ["living-angle.webp","guestroom-overview.webp","guestroom-angled.webp","guestroom-seating.webp","dining-overview.webp","living-front.webp"]
          for name in files:
              data = Path(name).read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Invalid WebP: {name}'
              assert len(data)>100000, f'File unexpectedly small: {name}'
              print(name, len(data))
          PY
      - name: Commit living room replacements and new guestroom dining renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/living-front.webp previews/rhynie-drive/images/living-angle.webp previews/rhynie-drive/images/guestroom-*.webp previews/rhynie-drive/images/dining-overview.webp
          if git diff --cached --quiet; then echo 'Already uploaded'; exit 0; fi
          git commit -m 'Update living room and add guestroom and dining render images'
          git push
