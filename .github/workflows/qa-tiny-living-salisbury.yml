name: QA Tiny Living against Salisbury
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-tiny-living-salisbury.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tiny-living-salisbury-layout
      - name: Install browser controller
        run: npm install --prefix /tmp/crio-qa --no-save playwright-core@1.56.1
      - name: Serve source locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/crio-http.log 2>&1 &
          sleep 2
      - name: Verify computed colours, responsive galleries, and lightbox; capture screenshots
        run: |
          cat > /tmp/crio-qa/test.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{
            const executablePath='/usr/bin/google-chrome';
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const url='http://127.0.0.1:8765/previews/tiny-living/';
            const folder=process.cwd()+'/scripts/qa-tiny-living';
            require('node:fs').mkdirSync(folder,{recursive:true});
            for(const device of [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport:{width:device.width,height:device.height},deviceScaleFactor:1,reducedMotion:'reduce'});
              await page.goto(url,{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.body.classList.contains('crio-ed'));
              const values=await page.evaluate(()=>{
                const hero=document.querySelector('.hero h1');
                const end=document.querySelector('.end-section h2');
                const footer=document.querySelector('.end-section');
                const image=document.querySelector('.hero-image');
                const shot=document.querySelector('.gallery .shot');
                return {
                  heading:window.getComputedStyle(hero).color,
                  closing:window.getComputedStyle(end).color,
                  closingBg:window.getComputedStyle(footer).backgroundColor,
                  heroImgLoaded:image.complete&&image.naturalWidth>0,
                  heroWidth:image.getBoundingClientRect().width,
                  viewport:innerWidth,
                  shotRatio:shot.getBoundingClientRect().width/shot.getBoundingClientRect().height,
                  galleryCount:document.querySelectorAll('.gallery .shot').length,
                  sectionCount:document.querySelectorAll('.collection').length,
                  editorBars:document.querySelectorAll('.crio-ed-bar').length,
                  oldTlCss:!!document.querySelector('.tl-cta,.tl-hero'),
                  scrollWidth:document.documentElement.scrollWidth
                }
              });
              console.log(device.name,JSON.stringify(values));
              assert.equal(values.heading,'rgb(244, 244, 244)','white Salisbury hero title');
              assert.equal(values.closing,'rgb(24, 24, 24)','dark heading on off-white closing');
              assert.equal(values.closingBg,'rgb(244, 244, 244)','off-white Salisbury closing');
              assert.equal(values.galleryCount,31);
              assert.equal(values.sectionCount,6);
              assert.equal(values.editorBars,1);
              assert.equal(values.oldTlCss,false);
              assert.ok(values.heroImgLoaded,'hero image loaded');
              assert.ok(Math.abs(values.shotRatio-4/3)<.02,'preserve native photo ratio');
              assert.ok(values.scrollWidth<=device.width+2,'no horizontal overflow');
              await page.screenshot({path:folder+'/'+device.name+'-hero.png',animations:'disabled'});
              await page.locator('.end-section').scrollIntoViewIfNeeded();
              await page.screenshot({path:folder+'/'+device.name+'-closing.png',animations:'disabled'});
              await page.locator('.gallery .shot').first().click();
              assert.equal(await page.locator('#lightbox').getAttribute('aria-hidden'),'false');
              await page.keyboard.press('ArrowRight');
              assert.match(await page.locator('#lightbox-counter').innerText(),/02 \/ 31/);
              await page.keyboard.press('Escape');
              assert.equal(await page.locator('#lightbox').getAttribute('aria-hidden'),'true');
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
          node /tmp/crio-qa/test.cjs
      - name: Write screenshots to temporary review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c qa/tiny-living-salisbury-screenshots
          git add scripts/qa-tiny-living
          git commit -m "Temporary visual QA screenshots of Salisbury-aligned Tiny Living"
          git push origin HEAD:refs/heads/qa/tiny-living-salisbury-screenshots
