name: Rhynie Drive Replace Both Upstairs Living Room Renders Nov 9
on:
  push:
    paths:
      - .github/workflows/rhynie-livingroom2-renew-nov9-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-living-room-2-renew-nov9-upload
  cancel-in-progress: false
jobs:
  upload-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve exact approved WebP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/WRozyZt6pr7ADYnJ' --output 'previews/rhynie-drive/images/living-room-2-seating.webp'
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/BT7ir4jWq6iJqwcX' --output 'previews/rhynie-drive/images/living-room-2-media-wall.webp'
      - name: Verify bytes match user uploads
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' \
            'a79a95422fa00dba948f4682285f4c4cc02b3185f978223b9e753ff7cfe17c84  living-room-2-seating.webp' \
            '209e14372b5f5a616678cee485cb9664dcda6e90ae6074b62ea917c863e4413a  living-room-2-media-wall.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          sizes = {"living-room-2-seating.webp":162008,"living-room-2-media-wall.webp":161672}
          for name,size in sizes.items():
              blob=Path(name).read_bytes()
              assert blob[:4]==b'RIFF' and blob[8:12]==b'WEBP'
              assert len(blob)==size, (name,len(blob))
              print(f'{name}: verified {size} WebP bytes')
          PY
      - name: Commit only two new Living Room 2 renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/living-room-2-seating.webp previews/rhynie-drive/images/living-room-2-media-wall.webp
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m 'Replace upstairs Living Room 2 photos with updated tropical lounge renders'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep 2
          done
          exit 1
