name: One-time Rhynie Drive Living Room 2 media image replacement
on:
  push:
    paths:
      - .github/workflows/rhynie-living2-media-nov9.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-living2-media-nov9-upload
  cancel-in-progress: false
jobs:
  replace-approved-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact approved render
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/z2NpTeCeajPpsfDB' --output previews/rhynie-drive/images/living-room-2-media-wall.webp
      - name: Verify original image file
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' '6885ff9e04f4b0eabd8ed060b44eeab4828b8594973fd48856fbdcafe14ef7b9  living-room-2-media-wall.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          content=Path('living-room-2-media-wall.webp').read_bytes()
          assert content[:4]==b'RIFF' and content[8:12]==b'WEBP'
          assert len(content)>100000
          print(f'Exact WebP verified: {len(content)} bytes')
          PY
      - name: Commit second upstairs Living Room view
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/living-room-2-media-wall.webp
          if git diff --cached --quiet; then echo 'Image is already current'; exit 0; fi
          git commit -m 'Replace second upstairs Living Room view with approved render'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep 2
          done
          exit 1
