name: Publish Rhynie Drive kitchen alternatives
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rhynie-drive-variations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import original uploaded WebP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --silent --show-error --retry 3 'https://at.adobe.com/qQHnVVqNKR0ZWD4M' -o 'previews/rhynie-drive/images/kitchen-sink-alternative.webp'
          curl --fail --location --silent --show-error --retry 3 'https://at.adobe.com/kHFjgDPAjNkpoGtO' -o 'previews/rhynie-drive/images/kitchen-overview-alternative.webp'
          cat <<'CHECKSUMS' | sha256sum --check --status
          554aaa123e4e1570f705015911f05b4ea77456bfa0181a42c5fb060ec402f02d  previews/rhynie-drive/images/kitchen-sink-alternative.webp
          3ab03d3738c9e2ddb350765fdafafe40792aa06288b64dbb6a69b3c36368203c  previews/rhynie-drive/images/kitchen-overview-alternative.webp
          CHECKSUMS
      - name: Publish additive image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/kitchen-sink-alternative.webp previews/rhynie-drive/images/kitchen-overview-alternative.webp
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add two alternate Rhynie Drive kitchen renders'
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
