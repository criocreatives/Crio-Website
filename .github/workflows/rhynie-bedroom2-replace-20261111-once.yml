name: Replace Bedroom 2 Twin-Bed Render Nov 11
on:
  push:
    paths:
      - .github/workflows/rhynie-bedroom2-replace-20261111-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-bedroom-2-replace-nov11-upload
  cancel-in-progress: false
jobs:
  replace-bed-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original JPEG and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/3VNbfjtVPuhoc8iw' --output /tmp/bedroom-2-replacement.jpeg
          echo 'bf1683cd67c676190ba7d5a05cd27ad8a92cd07c42799316c4943ef3591fb08f  /tmp/bedroom-2-replacement.jpeg' | sha256sum -c -
      - name: Convert JPEG to WebP at original dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src=Path('/tmp/bedroom-2-replacement.jpeg')
          dst=Path('previews/rhynie-drive/images/bedroom-2-twin-beds.webp')
          dst.parent.mkdir(parents=True, exist_ok=True)
          with Image.open(src) as original:
              im=ImageOps.exif_transpose(original).convert('RGB')
              assert im.size==(1447,1087), im.size
              im.save(dst,format='WEBP',quality=95,method=6)
          blob=dst.read_bytes()
          assert blob[:4]==b'RIFF' and blob[8:12]==b'WEBP' and len(blob)>100000
          with Image.open(dst) as im:
              assert im.format=='WEBP' and im.size==(1447,1087)
          print('Verified replacement WebP',dst,len(blob),'bytes')
          PY
      - name: Commit only the updated Bedroom 2 render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/bedroom-2-twin-beds.webp
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m 'Replace Bedroom 2 double-bed render with latest WebP'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep 2
          done
          exit 1
