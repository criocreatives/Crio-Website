name: Replace Living Room 2 Dry Bar WebP Nov 24
on:
  push:
    paths:
      - .github/workflows/rhynie-drybar-20261124-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-drybar-20261124-upload
  cancel-in-progress: false
jobs:
  update-drybar-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify uploaded WebP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://at.adobe.com/r0Ht4K4qowhVcwRR' --output /tmp/rhynie-drybar-new.webp
          echo '6c1dcb85ef0e7ac5d7d547d459961a9bf2010f036b8c35403ebb5677d505a1fb  /tmp/rhynie-drybar-new.webp' | sha256sum -c -
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/rhynie-drybar-new.webp') as im:
              assert im.format=='WEBP' and im.size==(1448,1086), (im.format,im.size)
          print('WebP format and original 1448x1086 dimensions verified')
          PY
      - name: Replace only the dry bar WebP
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/rhynie-drybar-new.webp previews/rhynie-drive/images/living-room-2-dry-bar.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/living-room-2-dry-bar.webp
          if git diff --cached --quiet; then echo 'Image already matches uploaded file'; exit 0; fi
          git commit -m 'Replace Living Room 2 dry bar WebP with illuminated wine cabinet render'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep 2
          done
          exit 1
