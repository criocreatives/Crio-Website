name: Validate and build existing Crio galleries
on:
  push:
    paths:
      - previews/gallery-manifests/**
      - scripts/templates/legacy-gallery/**
      - scripts/build_legacy_galleries.py
      - scripts/test_legacy_galleries.py
      - .github/workflows/build-legacy-crio-galleries.yml
  pull_request:
    paths:
      - previews/gallery-manifests/**
      - scripts/templates/legacy-gallery/**
      - scripts/build_legacy_galleries.py
      - scripts/test_legacy_galleries.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-crio-gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Validate image references and regenerate gallery output
        run: |
          python3 -m py_compile scripts/build_legacy_galleries.py scripts/test_legacy_galleries.py
          python3 scripts/build_legacy_galleries.py
          python3 scripts/build_legacy_galleries.py --check
          python3 scripts/test_legacy_galleries.py
          python3 scripts/check_seo.py
          python3 scripts/test_preview_directory.py
      - name: Commit regenerated pages to the source branch
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/*/index.html
          git -c core.whitespace=-blank-at-eol diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate existing Crio gallery layouts from ordered media manifests"
            git push origin "HEAD:refs/heads/${BRANCH}"
          else
            echo "Legacy gallery pages are already current."
          fi
