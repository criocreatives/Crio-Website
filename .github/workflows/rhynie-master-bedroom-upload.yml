name: Add Rhynie Drive master bedroom renders
on:
  push:
    paths:
      - .github/workflows/rhynie-master-bedroom-upload.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-master-bedroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved original WebP renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/QB6fZrypA04SNjaW' --output previews/rhynie-drive/images/master-bedroom-overview.webp
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/ZFmzra0oGaPhuOVw' --output previews/rhynie-drive/images/master-bedroom-window-view.webp
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/vCu674CGS0TUVvlC' --output previews/rhynie-drive/images/master-bedroom-tv-wall.webp
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/00fLP6gP3XRWCjyh' --output previews/rhynie-drive/images/master-bedroom-bed-view.webp
          cd previews/rhynie-drive/images
          printf '%s\n' \
            '4fa03f45d24fc7c1fc63e0f0b2bd027e597b24a2bb3965109472ecb7147fee17  master-bedroom-overview.webp' \
            'b5d6a9e6c761a2974e35b358778c64eec5c7d80c6dca3ae5d64041e0ef076f6b  master-bedroom-window-view.webp' \
            '47b187d4fc954f0ff01793c6ea1b39e9977cff213622c26db646d929c5b4eadd  master-bedroom-tv-wall.webp' \
            '3af8e6be64d12a12d0723124a23dbcc0dc3927e273e7623db3c6cdd984381330  master-bedroom-bed-view.webp' | sha256sum -c -
      - name: Commit renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/master-bedroom-*.webp
          if git diff --cached --quiet; then echo 'Master bedroom images already current'; exit 0; fi
          git commit -m 'Add four Rhynie Drive master bedroom renders'
          git push
