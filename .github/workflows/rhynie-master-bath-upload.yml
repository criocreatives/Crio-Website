name: Upload Rhynie Drive master bathroom renders
on:
  push:
    paths:
      - .github/workflows/rhynie-master-bath-upload.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload-master-bath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download provided master bathroom WebP images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/4DOd9cI3L5fAZ5f0' --output 'previews/rhynie-drive/images/master-bathroom-vanity-shower.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/QWzJpuEKuYO0Q7TZ' --output 'previews/rhynie-drive/images/master-bathroom-tub-view.webp'
      - name: Verify submitted images and proportions
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' \
            'd7d0c07d2882d40dc06637f5b6ba56c4fbd43265b6a52c0c54950228ebe91494  master-bathroom-vanity-shower.webp' \
            '2abc5ac31476e206069e177ac708a67982bb68c6836b75d5518699f3a4e59b4a  master-bathroom-tub-view.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          names = ["master-bathroom-vanity-shower.webp", "master-bathroom-tub-view.webp"]
          for name in names:
              data = Path(name).read_bytes()
              assert len(data) > 100000, f'Unexpectedly small: {name}'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Not a WebP: {name}'
              print(f'Verified {name} ({len(data)} bytes)')
          PY
      - name: Commit new master bathroom renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/master-bathroom-vanity-shower.webp previews/rhynie-drive/images/master-bathroom-tub-view.webp
          if git diff --cached --quiet; then echo 'Images already current'; exit 0; fi
          git commit -m 'Add two Rhynie Drive master bathroom renders'
          git push
