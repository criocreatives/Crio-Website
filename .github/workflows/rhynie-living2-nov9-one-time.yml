name: Replace Rhynie Drive Upstairs Living Room original WebPs
on:
  push:
    paths:
      - .github/workflows/rhynie-living2-nov9-one-time.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rhynie-living2-nov9-upload
  cancel-in-progress: false
jobs:
  update-approved-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the two exact uploaded images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/rhynie-drive/images
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/aA3ho5IFp2ep58Sw' --output 'previews/rhynie-drive/images/living-room-2-seating.webp'
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/jcqEpve2hd7MEtm4' --output 'previews/rhynie-drive/images/living-room-2-media-wall.webp'
      - name: Verify original WebP files byte for byte
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' \
            '457416b65a6ffb7e3bca4e61326f17014642e71321f19a55fe376a2a41ec94e7  living-room-2-seating.webp' \
            'a8dd71b4c540cef126fc2caed355bdb1e386842247ccd167703af332992f830b  living-room-2-media-wall.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          for file in ["living-room-2-seating.webp","living-room-2-media-wall.webp"]:
              blob=Path(file).read_bytes()
              assert blob[:4]==b'RIFF' and blob[8:12]==b'WEBP', f'Invalid WebP: {file}'
              assert len(blob)>100000, f'Unexpectedly small WebP: {file}'
              print(file, len(blob))
          PY
      - name: Commit the two replacement image files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/living-room-2-seating.webp previews/rhynie-drive/images/living-room-2-media-wall.webp
          if git diff --cached --quiet; then echo "Images already current"; exit 0; fi
          git commit -m 'Replace upstairs Living Room 2 images with November 9 approved renders'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo "Uploaded images to main"
              exit 0
            fi
            sleep 2
          done
          exit 1
