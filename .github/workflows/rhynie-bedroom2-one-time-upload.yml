name: Upload Rhynie Drive Bedroom 2 WebPs
on:
  push:
    paths:
      - .github/workflows/rhynie-bedroom2-one-time-upload.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload-bedroom2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original Bedroom 2 images from approved ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://at.adobe.com/SSRMsIOr79o4C9Eq' --output /tmp/rhynie-bedroom2.zip
          mkdir -p previews/rhynie-drive/images
          unzip -p /tmp/rhynie-bedroom2.zip 'Bedroom_2_View_2.webp' > previews/rhynie-drive/images/bedroom-2-overview.webp
          unzip -p /tmp/rhynie-bedroom2.zip 'Bedroom_2_View_1.webp' > previews/rhynie-drive/images/bedroom-2-media-wall.webp
      - name: Verify original files byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cd previews/rhynie-drive/images
          printf '%s\n' \
            '19f76bd3ad955f7ed5c63f5c92186efc9ad9dc1ff9725a72becda2db943233b7  bedroom-2-overview.webp' \
            'aec8c8a500761768bf7a19a50e36ebc64ebac959411ac4a5815e9f6e93449409  bedroom-2-media-wall.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          for name in ['bedroom-2-overview.webp','bedroom-2-media-wall.webp']:
              b=Path(name).read_bytes()
              assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', f'Not WebP: {name}'
              print(name,len(b),'bytes')
          PY
      - name: Commit project images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/rhynie-drive/images/bedroom-2-overview.webp previews/rhynie-drive/images/bedroom-2-media-wall.webp
          if git diff --cached --quiet; then echo 'Bedroom 2 images already current'; exit 0; fi
          git commit -m 'Add two Bedroom 2 render assets to Rhynie Drive'
          git push
