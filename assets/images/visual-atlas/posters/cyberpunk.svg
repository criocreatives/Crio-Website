<svg xmlns="http://www.w3.org/2000/svg" width="855" height="1100" viewBox="0 0 855 1100" role="img" aria-labelledby="title desc">
<title id="title">Cyberpunk poster study</title><desc id="desc">Original vector poster study with legible typeset wording in the Cyberpunk direction.</desc>
