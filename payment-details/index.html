<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>Payment Details — Crio Creatives</title>
<link rel="icon" href="/assets/images/crio-logo.png">
<link data-payment-shell rel="stylesheet" href="/assets/css/crio-subpage.css?v=1">
<style id="payment-theme">
:root{--crio:#ED1C24;--bg:#ECEDEE;--paper:#F4F4F4;--ink:#090909;--charcoal:#111214;--muted:#595B62;--line:rgba(9,9,9,.13);--body-font:"Century Gothic","Avenir Next",Avenir,Helvetica,Arial,sans-serif;--display-font:Helvetica,Arial,sans-serif;--depth:6px 6px 18px rgba(9,9,9,.055),-5px -5px 16px rgba(255,255,255,.55)}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body-font);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input{font:inherit}button{cursor:pointer}button:disabled,input:disabled{opacity:.52;cursor:not-allowed}
h1,h2,h3{font-family:var(--display-font);font-weight:500}
a,button,input,summary{touch-action:manipulation}
:is(a,button,summary):focus-visible{outline:2px solid var(--crio);outline-offset:4px}
::selection{background:var(--crio);color:var(--paper)}
/* The shared site header, with only the brand and page label. */
.payment-header .crio-shell-inner{width:min(1000px,calc(100vw - 64px));justify-content:center;gap:24px}
.payment-header-label{position:relative;padding-left:24px;color:var(--paper);font-size:14px;font-weight:500;line-height:1.3;white-space:nowrap}
.payment-header-label:before{content:"";position:absolute;left:0;top:50%;width:1px;height:34px;transform:translateY(-50%);background:linear-gradient(180deg,transparent,rgba(244,244,244,.18) 28%,rgba(244,244,244,.18) 72%,transparent);pointer-events:none}
@media(max-width:520px){.payment-header-label{padding-left:16px}.payment-header-label:before{height:28px}}
/* Compact access screen. */
body.crio-payment-page>main.page{display:block;min-height:0;padding:145px 24px 24px}
.access-layout{width:min(520px,100%);margin:auto}
.panel{width:100%;padding:26px;border:1px solid rgba(9,9,9,.09);border-radius:14px;background:var(--paper);box-shadow:var(--depth)}
.panel-heading{display:flex;align-items:center;gap:9px;margin-bottom:15px;color:var(--muted);font-size:13px;font-weight:600;line-height:1.4}

.form{margin-top:20px}.form label{display:block;margin:0 0 9px;font-size:15px;line-height:1.5;font-weight:500}

.form input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 1000px var(--paper) inset;caret-color:var(--ink)}
.form button{min-width:134px;height:50px;padding:0 17px;border:1px solid var(--crio);border-radius:8px;background:var(--crio);color:var(--paper);font-size:13px;font-weight:700;transition:background .18s ease,box-shadow .18s ease}
.form button:hover:not(:disabled){background:#D5141C;box-shadow:0 4px 12px rgba(237,28,36,.13)}
.status{display:none;margin-top:13px;padding:10px 12px;border:1px solid rgba(237,28,36,.2);border-radius:7px;background:rgba(237,28,36,.035);color:#9E171D;font-size:13px;line-height:1.55}
.status.info{border-color:var(--line);background:transparent;color:var(--muted)}
.help{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
.spinner{display:inline-block;width:11px;height:11px;margin-right:7px;border:2px solid rgba(244,244,244,.35);border-top-color:var(--paper);border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}
.access-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(1000px,calc(100% - 48px));margin:auto;padding:18px 0 22px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}
.access-footer p{margin:0}.access-footer nav{display:flex;flex-wrap:wrap;gap:18px}.access-footer a{text-decoration:none}.access-footer a:hover{color:var(--crio)}
/* Protected payment view. */
.shell{width:min(1000px,calc(100% - 64px));margin:auto;min-height:100vh}
.hero{padding:145px 0 20px}.hero .brand{display:none}
.hero h1{margin:0 0 12px;font-size:40px;line-height:1.05;letter-spacing:-.045em;font-weight:500;text-transform:lowercase}

.quicknav{display:flex;flex-wrap:wrap;gap:10px 24px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.quicknav a{color:var(--muted);font-size:13px;font-weight:600;line-height:1.5;text-decoration:none;transition:color .18s ease}.quicknav a:hover{color:var(--crio)}

.card .row:last-child{border-bottom:0}.label,.value{min-width:0;font-size:15px;line-height:1.5;letter-spacing:0;text-transform:none;overflow-wrap:anywhere}.label{color:var(--muted);font-weight:400}.value{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.copy:hover{border-color:var(--crio);color:var(--crio)}.copy.done{border-color:var(--charcoal);background:var(--charcoal);color:var(--paper)}
.quick-card .row{grid-template-columns:115px minmax(0,1fr) auto}

summary{display:grid;grid-template-columns:34px minmax(0,1fr) 26px;align-items:center;gap:12px;min-height:65px;padding:12px 15px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.wire-option-icon{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(88,102,200,.16);border-radius:6px;background:rgba(88,102,200,.07);color:#505B9A;font-size:10px;font-weight:600;line-height:1}
.wire-option-title{min-width:0}.wire-option-title strong{display:block;font-family:var(--display-font);font-size:19px;font-weight:500;line-height:1.2;letter-spacing:-.02em}.wire-option-title small{display:block;margin-top:3px;color:var(--muted);font-size:13px;line-height:1.4}
summary:after{content:"+";display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;color:var(--ink);font:400 19px/1 var(--display-font)}details[open] summary{border-bottom:1px solid var(--line)}details[open] summary:after{content:"−"}
.subnote{padding:12px 15px 4px;color:var(--muted);font-size:14px;line-height:1.55}.wire-grid{padding:0 15px 6px}.wire-grid .row{grid-template-columns:195px minmax(0,1fr) auto}
.note{display:flex;align-items:flex-start;gap:12px;margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
.note .icon{display:grid;place-items:center;flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:6px;color:var(--crio);font-size:14px}.note h3{margin:0 0 6px;font-size:21px;line-height:1.15;letter-spacing:-.025em}.note p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.security{margin-top:18px;padding:2px 0 2px 16px;border-left:2px solid var(--crio);color:var(--muted);font-size:13px;line-height:1.65}.security strong{color:var(--ink);font-size:14px;font-weight:600;line-height:1.8}
.footer{display:flex;justify-content:space-between;gap:18px;padding:18px 0 24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}.footer strong{color:var(--ink);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:520px){.payment-header .crio-shell-inner{width:calc(100vw - 32px);gap:12px}.payment-header .crio-shell-logo{width:140px;height:auto}.payment-header-label{font-size:12px}body.crio-payment-page>main.page{padding:106px 20px 20px}.panel{padding:23px}.panel h1{font-size:31px}.panel>p{font-size:14px}.form{margin-top:17px}.form label{font-size:14px}.form input{padding-inline:13px}.form button{min-width:124px;padding:0 12px;font-size:12px}.help{font-size:12px}.access-footer{width:calc(100% - 40px);padding:16px 0 20px}.access-footer nav{gap:16px}.shell{width:calc(100% - 32px)}.hero{padding:106px 0 16px}.hero h1{font-size:31px;margin-bottom:10px}.hero p{font-size:14px;line-height:1.6}.quicknav{gap:9px 16px}.quicknav a{font-size:12px}.card-head{gap:11px;padding:14px}.card-title h2{font-size:22px}.card-title p{font-size:13px}.currency{font-size:10px;padding:5px 6px}.logo-box{width:42px;height:42px}.logo-box.wide{width:70px}.logo-box.mercury-logo{width:100px}.mercury .card-head{flex-wrap:wrap}.mercury .card-title{flex:1;min-width:130px}.mercury .currency{margin-left:0}.rows{padding-inline:14px}.card .row,.wire-grid .row,.quick-card .row{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0}.card .label,.wire-grid .label{grid-column:1}.card .value,.wire-grid .value{grid-column:1}.card .copy,.wire-grid .copy{grid-column:2;grid-row:1/3;min-height:44px}.label,.value{font-size:14px;line-height:1.5}.label{color:#55575F}.value{font-weight:600}.copy{font-size:11px}details{margin:10px}summary{grid-template-columns:31px minmax(0,1fr) 25px;gap:10px;padding:12px 11px}.wire-option-icon{width:31px;height:32px;font-size:9px}.wire-option-title strong{font-size:18px}.wire-option-title small{font-size:12px}.wire-option-title{overflow-wrap:anywhere}summary:after{width:25px;height:25px}.subnote{padding:11px 12px 3px;font-size:13px}.wire-grid{padding:0 12px 5px}.note{margin-top:19px;padding:16px 14px;gap:10px}.note h3{font-size:20px}.note p{font-size:13px}.security{font-size:12px}.footer{flex-direction:column;gap:10px;font-size:12px}}
@media(max-width:360px){.payment-header .crio-shell-logo{width:128px}.payment-header-label{font-size:11px}.panel{padding:20px}.form button{min-width:113px}.form input{padding-inline:11px}.card-head{gap:9px}.logo-box.wide{width:64px}.card-title h2{font-size:21px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}a,button,input{transition:none!important}.spinner{animation:none}}
@media print{@page{margin:12mm}body,.shell{background:#fff}.shell{width:100%;min-height:0}.payment-header,.copy,.quicknav{display:none!important}.hero{padding:0 0 18px}.hero h1{font-size:32px}.shell main{padding:18px 0}.section{margin-top:22px}.card{box-shadow:none;break-inside:avoid}.cards{display:block}.card+.card{margin-top:14px}.card-head:before{filter:none}details{display:block;overflow:visible;break-inside:avoid}details>summary{display:none}details:not([open])>*:not(summary){display:block}details::details-content{content-visibility:visible!important;height:auto!important}.footer{padding-bottom:0}}

<body class="crio-payment-page">
<header class="crio-shell-header payment-header" id="site-header"><div class="crio-shell-inner"><a class="crio-shell-brand" href="/" aria-label="Crio Creatives home"><img class="crio-shell-logo" src="/assets/logos/Crio%20Creatives%20Logo%20wide%20white.svg" alt="Crio Creatives" width="177" height="51"></a><span class="payment-header-label">Payment information</span></div></header>
<main class="page"><div class="access-layout">
<section class="panel" aria-labelledby="access-title">
<div class="panel-heading"><svg viewBox="0 0 20 22" fill="none" aria-hidden="true"><rect x="3" y="9" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 9V6a4 4 0 0 1 8 0v3M10 13v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Client access</div>
<h1 id="access-title">Payment details</h1>
<p id="access-instructions">Enter the 4-digit access code provided by Crio Creatives to view payment information.</p>
<form class="form" id="unlock-form"><label for="pin">Access code</label><div class="row">
<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" minlength="4" autocomplete="off" enterkeyhint="go" autocapitalize="off" spellcheck="false" aria-describedby="access-instructions" required autofocus>
<button id="unlock" type="submit">View details</button></div><div class="status" id="status" role="alert"></div></form>
<div class="help">For authorized client use only. Access attempts are limited on this device.</div>
</section></div></main>
<script>
(()=>{"use strict";
const DATA={iterations:2000000,salt:"DKIDvDjAEigxR8EPpPBN4Q==",iv:"AErpT+N9HgsAzA02",aad:"Y3Jpby1wYXltZW50LWRldGFpbHMtZ3ppcC12MQ==",files:["/payment-details/data/00.txt","/payment-details/data/01.txt","/payment-details/data/02.txt","/payment-details/data/03.txt","/payment-details/data/04.txt","/payment-details/data/05.txt","/payment-details/data/06.txt","/payment-details/data/07.txt","/payment-details/data/08.txt"]};
const MAX_ATTEMPTS=5,LOCK_MS=15*60*1000,RELOCK_MS=30*60*1000,STORE_KEY="crio_pd_access_v2";
// Share the compact presentation and site header without changing payment values or controls.
const PAYMENT_THEME=document.getElementById("payment-theme").outerHTML;
const PAYMENT_HEADER=document.getElementById("site-header").outerHTML;
const PAYMENT_SHELL_CSS=document.querySelector("link[data-payment-shell]").outerHTML;
const PAYMENT_SHELL_SCRIPT='<script src="/assets/js/site.js?v=2"><'+'/script>';
const sentenceLabel=text=>text.startsWith("$")?text:text.replace(/\b[A-Z][a-z]+\b/g,(word,index)=>index===0?word:word.toLowerCase());
const themeDetails=html=>html
  .replace(/style-src 'unsafe-inline'/g,"style-src 'self' 'unsafe-inline'")
  .replace(/script-src 'unsafe-inline'/g,"script-src 'self' 'unsafe-inline'")
  .replace(/<style\b[^>]*>[\s\S]*?<\/style>/i,()=>PAYMENT_SHELL_CSS+PAYMENT_THEME)
  .replace(/<body\b[^>]*>/i,tag=>tag+PAYMENT_HEADER)
  .replace(/(<div class="label">)([^<]*)(<\/div>)/g,(_,start,text,end)=>start+sentenceLabel(text)+end)
  .replace(/<\/body>/i,()=>PAYMENT_SHELL_SCRIPT+"</body>");
const form=document.getElementById("unlock-form"),input=document.getElementById("pin"),button=document.getElementById("unlock"),status=document.getElementById("status");
let busy=false,countdownTimer=null,ciphertextCache=null,relockTimer=null;
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const readState=()=>{try{return JSON.parse(localStorage.getItem(STORE_KEY))||{attempts:0,lockUntil:0}}catch(_){return{attempts:0,lockUntil:0}}};
const writeState=s=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch(_){}};
const clearState=()=>{try{localStorage.removeItem(STORE_KEY)}catch(_){}};
const show=(m,k="error")=>{status.className="status"+(k==="info"?" info":"");status.textContent=m;status.style.display="block"};
const hide=()=>{status.style.display="none";status.textContent=""};
const setDisabled=d=>{input.disabled=d;button.disabled=d};
function updateLockUI(){const s=readState(),r=s.lockUntil-Date.now();if(r<=0){if(s.lockUntil)writeState({attempts:0,lockUntil:0});setDisabled(false);if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}return false}setDisabled(true);const sec=Math.ceil(r/1000),m=Math.floor(sec/60),rem=sec%60;show("Too many incorrect attempts. Try again in "+m+":"+String(rem).padStart(2,"0")+".");if(!countdownTimer)countdownTimer=setInterval(updateLockUI,1000);return true}
async function loadCiphertext(){if(ciphertextCache)return ciphertextCache;const parts=await Promise.all(DATA.files.map(async u=>{const r=await fetch(u,{cache:"no-store",credentials:"same-origin"});if(!r.ok)throw new Error("data");return(await r.text()).trim()}));ciphertextCache=parts.join("");return ciphertextCache}
async function deriveKey(pin){const mat=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:fromB64(DATA.salt),iterations:DATA.iterations,hash:"SHA-256"},mat,{name:"AES-GCM",length:256},false,["decrypt"])}
async function decrypt(pin){const ciphertext=await loadCiphertext();const key=await deriveKey(pin);const compressed=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(DATA.iv),additionalData:fromB64(DATA.aad),tagLength:128},key,fromB64(ciphertext));if(typeof DecompressionStream!=="function")throw new Error("browser");const ds=new DecompressionStream("gzip");const plain=await new Response(new Blob([compressed]).stream().pipeThrough(ds)).arrayBuffer();return new TextDecoder().decode(plain)}
input.addEventListener("input",function(){this.value=this.value.replace(/\D/g,"").slice(0,4);if(!busy&&!readState().lockUntil)hide()});
