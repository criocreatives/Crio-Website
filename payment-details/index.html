<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Payment Details — Crio Creatives</title>
<link rel="icon" href="/assets/images/crio-logo.png">
<style>
:root{--red:#ed1c24;--bg:#0d0f14;--panel:#151820;--line:rgba(255,255,255,.09);--muted:#aeb3bd}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Helvetica,Arial,sans-serif}
body{min-height:100vh;color:#fff}
#portal-frame{display:none;width:100%;height:100vh;border:0;background:var(--bg)}
.setup{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden}
.setup:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0%,rgba(237,28,36,.16),transparent 34%),radial-gradient(circle at 5% 95%,rgba(237,28,36,.08),transparent 30%);pointer-events:none}
.card{position:relative;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:23px;padding:31px;box-shadow:0 28px 70px rgba(0,0,0,.36);overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--red)}
.logo{width:54px;height:54px;object-fit:cover;border-radius:10px;margin-bottom:28px}
.eyebrow{color:#d8dbe2;font-size:10px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;margin-bottom:11px}
h1{margin:0 0 11px;font-size:31px;line-height:1.03;letter-spacing:-.045em}
p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
a{display:inline-flex;margin-top:22px;color:#fff;text-decoration:none;font-size:12px;font-weight:800}
@media(max-width:480px){.card{padding:27px 21px}}
</style>
</head>
<body>
<iframe id="portal-frame" title="Crio Creatives secure payment details"></iframe>
<main class="setup" id="setup">
<section class="card">
<img class="logo" src="/assets/images/crio-logo.png" alt="">
<div class="eyebrow">Secure client access</div>
<h1>Payment Details</h1>
<p>The secure payment portal is being connected. Please check back shortly.</p>
<a href="/">Back to Crio ↗︎</a>
</section>
</main>
<script>
const CRIO_PAYMENT_APP_URL='';
if(CRIO_PAYMENT_APP_URL){
  const frame=document.getElementById('portal-frame');
  frame.src=CRIO_PAYMENT_APP_URL;
  frame.style.display='block';
  document.getElementById('setup').remove();
}
</script>
</body>
</html>
