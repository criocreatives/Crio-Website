<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="5;url=../">
<title>Message received — Crio Creatives</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/logos/Crio%20Creatives%20Logo%20favicon.png">
<link rel="stylesheet" href="../style.css?v=2">
<style>
html,body{margin:0;min-height:100%;background:#090909;color:#f4f4f4;font-family:Helvetica,Arial,sans-serif}
.thanks-page{min-height:100svh;display:grid;place-items:center;padding:32px 20px}
.thanks-card{width:min(720px,100%);box-sizing:border-box;padding:48px;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:#111214;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.thanks-logo{display:block;width:189px;height:54px;object-fit:cover;border-radius:9px;margin:0 0 30px}
.thanks-card .eyebrow{margin:0 0 14px;color:#ed1220;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.thanks-card h1{margin:0;max-width:620px;font-size:clamp(42px,6vw,72px);line-height:.96;letter-spacing:-.055em}
.thanks-copy{max-width:590px;margin:22px 0 0;color:#b4b4b9;font-size:17px;line-height:1.65}
.thanks-redirect{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.13)}
.thanks-redirect p{margin:0;color:#b4b4b9;font-size:13px;line-height:1.5}
.thanks-countdown{color:#fff;font-weight:800}
.thanks-back{display:inline-flex;align-items:center;justify-content:center;background:#ed1220;color:#fff;padding:14px 20px;border-radius:9px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
@media(max-width:600px){.thanks-page{padding:18px}.thanks-card{padding:30px 24px}.thanks-logo{width:161px;height:46px;margin-bottom:24px}.thanks-redirect{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="thanks-page">
  <section class="thanks-card" aria-labelledby="thanks-title">
    <img class="thanks-logo" src="../assets/logos/Crio%20Creatives%20Logo%20wide%20on%20red.svg" alt="Crio Creatives">
    <p class="eyebrow">Message received</p>
    <h1 id="thanks-title">Thanks for reaching out.</h1>
    <p class="thanks-copy">Your project enquiry has been sent successfully. We’ll review the details and get back to you shortly.</p>
    <div class="thanks-redirect">
      <p>Returning to Crio Creatives in <span class="thanks-countdown" id="countdown">5</span> seconds.</p>
      <a class="thanks-back" href="../">Back now →</a>
    </div>
  </section>
</main>
<script>
(() => {
  let remaining = 5;
  const el = document.getElementById('countdown');
  const timer = setInterval(() => {
    remaining -= 1;
    if (el) el.textContent = String(Math.max(remaining,0));
    if (remaining <= 0) clearInterval(timer);
  }, 1000);
})();
</script>

<!-- LibreCounter: privacy-friendly page analytics -->
<img src="https://librecounter.org/hidden.svg" referrerpolicy="unsafe-url" alt="" width="1" height="1" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">
</body>
</html>
